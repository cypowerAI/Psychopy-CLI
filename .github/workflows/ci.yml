name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: core (no PsychoPy) on ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Core tests (no PsychoPy, no stim)
        run: python -m pytest -q -m "not psychopy and not stim"
      - name: Docs are up to date
        run: |
          python tools/gen_command_docs.py
          git diff --exit-code docs/commands.md
      - name: Catalogue parses
        run: psychopy-cli catalog --format json > catalog.json

  full:
    name: full suite on 3.11 (PsychoPy + stim)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          sudo apt-get update && sudo apt-get install -y libgl1 libglu1-mesa xvfb
          pip install -e ".[psychopy,stim,dev]"
      - name: Tests
        run: xvfb-run -a python -m pytest -q
      - name: Smoke the documented workflow
        run: |
          xvfb-run -a bash -c '
            set -e
            psychopy-cli doctor --format json
            psychopy-cli spec new stroop -o /tmp/stroop.spec.json
            psychopy-cli spec validate /tmp/stroop.spec.json
            psychopy-cli build /tmp/stroop.spec.json -o /tmp/build --script
            psychopy-cli run /tmp/stroop.spec.json --simulate -o /tmp/sim
          '
