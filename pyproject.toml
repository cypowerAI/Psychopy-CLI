[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "psychopy-cli"
version = "0.1.0"
description = "A machine-readable command line interface for PsychoPy, designed for LLM agents"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "cypowerAI" }]
keywords = ["psychopy", "psychology", "experiment", "cli", "llm", "agent"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
# Core is dependency-free on purpose: catalog/spec/stim/data all run on the
# standard library only, so an agent can inspect the tool before paying for
# a full PsychoPy install.
dependencies = []

[project.optional-dependencies]
# The real thing: needed for `build` (Builder round-trip) and `run`.
psychopy = ["psychopy>=2024.1.0"]
# Vector stimulus rendering (`stim *` commands).
stim = ["numpy>=1.22", "Pillow>=9.0"]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
psychopy-cli = "psychopy_cli.cli:main"

[project.urls]
Homepage = "https://github.com/cypowerAI/Psychopy-CLI"
Source = "https://github.com/cypowerAI/Psychopy-CLI"

[tool.hatch.build.targets.wheel]
packages = ["src/psychopy_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "psychopy: requires an installed PsychoPy (skipped when missing)",
  "stim: requires numpy + Pillow",
]
